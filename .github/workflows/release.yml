name: Reviewed draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-draft:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate tag and source metadata
        shell: pwsh
        run: |
          python scripts/verify_repository.py --release-tag "$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm ci --ignore-scripts --no-audit
        working-directory: app
      - run: npm run check
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo fmt --all
      - run: cargo metadata --locked --format-version 1 > cargo-metadata.json
      - run: cargo test --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings
      - run: cargo install tauri-cli --version '^2' --locked
      - run: cargo build --locked --release -p tandem-core --bin tandem
      - run: cargo tauri build
        working-directory: app
      - name: Record checksums and publish only a draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem target/release/bundle/nsis/*.exe)
          $assets += Get-Item target/release/tandem.exe
          $sums = $assets | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name }
          $sums | Set-Content SHA256SUMS.txt
          gh release create "$env:GITHUB_REF_NAME" $assets.FullName SHA256SUMS.txt --draft --verify-tag --title "Tandem Workbench $env:GITHUB_REF_NAME" --notes "Source and automated build checks completed. This draft still requires manual Windows SCM/ACL/reboot acceptance, signing and upstream provenance review; see docs/DEPLOYMENT.md."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
