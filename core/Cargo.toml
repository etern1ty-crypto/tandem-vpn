[package]
name = "tandem-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Auditable Windows connectivity operations, shared by Tandem CLI and Tauri."

[lib]
name = "tandem_core"
path = "src/lib.rs"

[[bin]]
name = "tandem"
path = "src/bin/tandem.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=1.0.69"
sha2 = "=0.10.9"
url = "=2.5.8"
ureq = { version = "=2.12.1", features = ["tls"] }
zip = "=0.6.6"
